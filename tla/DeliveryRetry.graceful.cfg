\* TLC Model Checker Configuration — GRACEFUL SHUTDOWN liveness model
\*
\* Checks liveness under GracefulSpec, which has no fairness on Cancel:
\* hard cancellation may never fire, so termination must come from the
\* stop_retrying signal (or the sink) alone.
\*
\* Run: java -cp tla2tools.jar tlc2.TLC MCDeliveryRetry.tla -config DeliveryRetry.graceful.cfg
\*
\* WARNING: Never use CONSTRAINT or SYMMETRY in liveness models.

SPECIFICATION GracefulSpec

CONSTANTS
    InitialBackoffMs = 100
    MaxBackoffMs = 800
    MaxRetries = 3

PROPERTIES
    StopRetryingTerminates
    ShutdownTerminates
    HealthySinkDelivers
