# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Only error on unmaintained crates in our workspace, not transitive deps.
unmaintained = "workspace"
# Advisories with no fix reachable by a lockfile update, approved by the
# maintainer. Tracked in #2918; remove each entry once its exit path lands.
ignore = [
    # chrono is unmaintained (all versions); required by arrow/datafusion.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by arrow/datafusion (#2918)" },
    # h2 0.3 has no patched release; only via otel-opamp-rs 0.0.14 (latest)
    # -> reqwest 0.11 -> hyper 0.14 for the OpAMP client.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 via otel-opamp-rs OpAMP client; no 0.3 fix (#2918)" },
    # quick-xml 0.26 via pprof 0.15 (latest) flamegraph -> inferno 0.11;
    # ffwd-bench profiling only.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.26 via pprof flamegraph, ffwd-bench only (#2918)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.26 via pprof flamegraph, ffwd-bench only (#2918)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CDDL-1.0",
]
confidence-threshold = 0.8

# Workspace crates are private (publish = false) and don't need licenses.
[licenses.private]
ignore = true

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
