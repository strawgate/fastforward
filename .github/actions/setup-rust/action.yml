name: Setup Rust
description: Install the Rust toolchain pinned in rust-toolchain.toml with clippy, rustfmt, and cargo cache.

runs:
  using: composite
  steps:
    # rust-toolchain.toml is the single source of truth for the CI toolchain,
    # so a new stable release cannot turn every PR red overnight.
    - name: Read pinned toolchain
      id: toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::could not read toolchain channel"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: clippy, rustfmt

    - name: Install mold linker
      if: runner.os == 'Linux'
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

    - name: Configure mold as linker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang' >> "$GITHUB_ENV"
        echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"

    - name: Disable sccache in CI
      shell: bash
      run: |
        # .cargo/config.toml sets rustc-wrapper=sccache for local dev.
        # CI doesn't install sccache, so override to empty.
        echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
