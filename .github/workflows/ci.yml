  # -------------------------------------------------------------------------
  # Coverage — workspace code coverage via llvm-cov.
  # Informational only (continue-on-error); non-draft PRs, no path filter.
  # -------------------------------------------------------------------------
  coverage:
    name: Code Coverage
    needs: [test-linux]
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-dashboard
      - uses: ./.github/actions/setup-rust
      - run: rustup component add llvm-tools-preview
        shell: bash
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: Generate workspace coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info --profile ci

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir htmlcov

      - name: Generate Coverage Summary
        run: cargo llvm-cov report --summary-only > coverage-summary.txt

      - name: Write to Job Summary
        run: |
          {
            echo "## Code Coverage Summary"
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-html
          path: htmlcov/

      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-lcov
          path: lcov.info

  # -------------------------------------------------------------------------
  # Conclusion — single required status check for branch protection.
  # Pattern from rust-analyzer and cargo: set ONE required check
  # ("conclusion") instead of maintaining a list of individual job names.
  # -------------------------------------------------------------------------
  conclusion:
    name: CI conclusion
    if: ${{ always() && !cancelled() }}
    needs:
      - changes
      - frontend
      - lint
      - test-linux
      - test-macos
      - test-network
      - cross-check
      - feature-check
      - kani
      - miri-core
      - miri-types
      - miri-io-buffered
      - simulation-turmoil
      - simulation-loom
      - tlc-safety
      - tlc-liveness-coverage
    runs-on: ubuntu-latest
    steps:
      - run: |
          jq -C <<< '${{ toJson(needs) }}'
          jq --exit-status 'all(.result == "success" or .result == "skipped")' \
            <<< '${{ toJson(needs) }}'
