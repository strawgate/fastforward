name: Nightly extended testing
on:
  schedule:
    - cron: '0 4 * * *'  # 4am UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  proptest-extended:
    name: Proptest (100K cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Run proptests with 100K cases
        run: |
          cargo test -p ffwd-core --test it -- proptest
          cargo test -p ffwd-io --test it -- proptest
          cargo test -p ffwd-types -- proptest
          cargo test -p ffwd-output -- proptest
        env:
          PROPTEST_CASES: "100000"

  tla-pipeline-nightly-thorough:
    name: TLA+ PipelineMachine (nightly thorough)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: TLC PipelineMachine nightly thorough model
        uses: ./.github/actions/run-tlc
        with:
          tla-file: tla/MCPipelineMachine.tla
          config: tla/PipelineMachine.nightly.thorough.cfg

  tla-pipeline-nightly-thorough-report:
    permissions:
      contents: read
      issues: write
    name: TLA+ nightly thorough failure report
    needs: tla-pipeline-nightly-thorough
    if: |
      always() &&
      github.event_name == 'schedule' &&
      needs.tla-pipeline-nightly-thorough.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The upstream job's result is 'failure' for any non-zero exit in the
      # run-tlc composite action, which includes real TLC counterexamples
      # AND infra failures (JDK setup, jar download, cache restore).  We
      # can't distinguish without parsing artifacts, so the title/body stay
      # neutral about the cause — first triage step is to open the run URL
      # and see which step in run-tlc turned red.
      #
      # Dedup: a stable title plus a label filter lets us comment on an
      # existing open issue instead of spamming a new one every day while
      # the same regression persists.
      - name: File or update issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: "Nightly TLA+ thorough job failing"
          ISSUE_LABEL: "bug"
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          date_iso="$(date -u +%Y-%m-%d)"

          existing="$(gh issue list \
            --state open \
            --label "$ISSUE_LABEL" \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" \
            | head -n1)"

          body_file="$(mktemp)"
          if [ -n "$existing" ]; then
            cat >"$body_file" <<EOF
          Recurrence on ${date_iso}: ${run_url}

          Open the run URL to determine whether the cause is a TLC
          counterexample or infrastructure (JDK setup, jar download,
          cache miss).
          EOF
            gh issue comment "$existing" --body-file "$body_file"
          else
            cat >"$body_file" <<EOF
          Nightly TLA+ thorough job failed.

          - Spec: tla/MCPipelineMachine.tla
          - Config: tla/PipelineMachine.nightly.thorough.cfg
          - First observed: ${date_iso}
          - First run: ${run_url}

          The upstream job failed — open the run URL to determine whether
          this is a real TLC counterexample or an infrastructure issue
          (JDK setup, jar download, cache miss).

          If TLC itself failed, reproduce locally:
            just tlc MCPipelineMachine.tla PipelineMachine.nightly.thorough.cfg

          TLC prints the violated invariant / liveness property and the
          state trace just before exiting.  If the run step never reached
          the \`tlc2.TLC\` invocation, the issue is infrastructure — close
          this issue once the underlying transient resolves.  Subsequent
          failures while this issue stays open will be appended as comments
          rather than spawning new issues.
          EOF
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file "$body_file" \
              --label "$ISSUE_LABEL"
          fi

  turmoil-replay-equivalence:
    name: Turmoil replay-equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/linearizability/go.mod
      - name: Replay-equivalence test lane
        run: |
          cargo test -p ffwd --no-default-features --features turmoil --test turmoil_sim fault_scenario_sim::replay_equivalence_seed_supports_three_identical_replays -- --exact
          cargo test -p ffwd --no-default-features --features turmoil --test turmoil_sim fault_scenario_sim::replay_equivalence_seed_matrix_keeps_history_equivalent -- --exact
          cargo test -p ffwd --no-default-features --features turmoil --test turmoil_sim linearizability::porcupine_checker_accepts_runtime_history -- --exact

  turmoil-seed-sweep:
    name: Turmoil seed sweep (1000 seeds, shard ${{ matrix.shard_index }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/linearizability/go.mod
      - name: Build turmoil tests once
        run: cargo test -p ffwd --no-default-features --features turmoil --test turmoil_sim --no-run
      - name: Run turmoil tests with shard-assigned seeds
        env:
          # Stop starting new seeds well before the 75-minute job timeout so
          # results are always uploaded. Budget: ~10 min setup/build + 50 min
          # of seeds + one last seed (<= 5 min + 30 s kill grace) + upload.
          # Healthy seeds take 5-20 s, so the per-seed cap only catches hangs.
          TURMOIL_SWEEP_BUDGET_SECS: "3000"
          TURMOIL_SEED_TIMEOUT_SECS: "300"
        run: |
          scripts/turmoil-seed-sweep.sh "${{ matrix.shard_index }}" 8 1000 \
            "turmoil-sweep/shard-${{ matrix.shard_index }}"
      - name: Upload turmoil sweep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turmoil-sweep-shard-${{ matrix.shard_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: turmoil-sweep/
          if-no-files-found: ignore
          retention-days: 30
  turmoil-seed-sweep-report:
    permissions:
      contents: read
      issues: write
    name: Turmoil seed sweep failure report
    needs: turmoil-seed-sweep
    if: always() && github.event_name == 'schedule' && needs.turmoil-seed-sweep.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download turmoil shard results
        uses: actions/download-artifact@v8
        with:
          pattern: turmoil-sweep-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/turmoil-artifacts
          # Every shard writes into its own shard-<N>/ directory, so merging
          # keeps a stable layout whether one or many artifacts match.
          merge-multiple: true
      - name: Create or update aggregated issue on turmoil seed sweep failure
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          summary_file="$(mktemp)"
          repro_file="$(mktemp)"
          failed_shards=0
          total_fail_count=0
          shards_with_results=0
          unfinished_shards=""

          # Locate shard result directories by their marker file rather than
          # by artifact directory names.
          while IFS= read -r shard_file; do
            shard_dir="$(dirname "$shard_file")"
            shard="$(cat "$shard_file")"
            shards_with_results=$((shards_with_results + 1))
            if [ ! -f "$shard_dir/summary.txt" ]; then
              unfinished_shards="${unfinished_shards} ${shard}"
            fi
            failures_tsv="$shard_dir/failures.tsv"
            fail_count=0
            if [ -s "$shard_dir/failed_seeds.txt" ]; then
              fail_count=$(wc -l < "$shard_dir/failed_seeds.txt" | tr -d ' ')
            fi
            skipped=0
            if [ -s "$shard_dir/skipped_seeds.txt" ]; then
              skipped=$(wc -l < "$shard_dir/skipped_seeds.txt" | tr -d ' ')
            fi
            if [ "$fail_count" -eq 0 ]; then
              continue
            fi
            failed_shards=$((failed_shards + 1))
            total_fail_count=$((total_fail_count + fail_count))
            {
              echo "- Shard ${shard}: ${fail_count} failed seed(s), ${skipped} skipped for time budget"
              # Cap detail rows so the issue body stays under GitHub's
              # 65,536-character limit; full results are in the artifact.
              awk -F'\t' 'NR <= 25 { printf "  - seed `%s`: `%s`\n", $1, $2 }
                END { if (NR > 25) printf "  - ... %d more (see artifact)\n", NR - 25 }' "$failures_tsv"
            } >>"$summary_file"
            # Named tests replay with --exact; TIMEOUT/UNKNOWN rows replay the
            # whole suite serially, as the sweep ran it.
            awk -F'\t' '
              $2 ~ /^(TIMEOUT|UNKNOWN)/ { printf "TURMOIL_SEED=%s cargo test -p ffwd --no-default-features --features turmoil --test turmoil_sim -- --test-threads=1\n", $1; next }
              { printf "TURMOIL_SEED=%s cargo test -p ffwd --no-default-features --features turmoil --test turmoil_sim %s -- --exact\n", $1, $2 }' \
              "$failures_tsv" >>"$repro_file"
          done < <(find /tmp/turmoil-artifacts -type f -name shard.txt | sort)

          # Shards that failed for infra/compile reasons produce no failed
          # seeds; do not file an issue for those.
          if [ "$total_fail_count" -eq 0 ]; then
            echo "No seed failures to report (shards may have failed for infra/compile reasons; see ${run_url})."
            exit 0
          fi

          # Dedup against a stable title so persistent regressions append
          # comments instead of opening a new issue every night.
          issue_title="Nightly turmoil seed sweep failing"
          date_iso="$(date -u +%Y-%m-%d)"
          existing="$(gh issue list \
            --state open \
            --label bug \
            --search "in:title \"$issue_title\"" \
            --json number,title \
            --jq ".[] | select(.title == \"$issue_title\") | .number" \
            | head -n1)"

          body_file="$(mktemp)"
          {
            if [ -n "$existing" ]; then
              echo "Recurrence on ${date_iso}: ${run_url}"
            else
              echo "Nightly turmoil seed sweep failed."
              echo
              echo "- First observed: ${date_iso}"
              echo "- First run: ${run_url}"
            fi
            echo
            echo "- Failed shards: ${failed_shards}"
            echo "- Shards with results: ${shards_with_results}/8 (missing shards failed before the sweep ran; check the run)"
            if [ -n "$unfinished_shards" ]; then
              echo "- Shards that stopped mid-sweep:${unfinished_shards}"
            fi
            echo "- Total failed seeds: ${total_fail_count}"
            echo
            cat "$summary_file"
            echo
            echo "Reproduce locally:"
            echo
            echo '```sh'
            # sed (not head) consumes all input, avoiding SIGPIPE under pipefail.
            sort -u "$repro_file" | sed -n '1,20p'
            echo '```'
            echo
            echo "Full logs: artifacts \`turmoil-sweep-shard-*-${{ github.run_id }}\` on the run page."
            if [ -z "$existing" ]; then
              echo
              echo "Please investigate and convert any reproductions into deterministic"
              echo "tests. Subsequent failures while this issue stays open will be"
              echo "appended as comments rather than spawning new issues."
            fi
          } >"$body_file"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create \
              --title "$issue_title" \
              --body-file "$body_file" \
              --label "bug"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  fuzz:
    name: Fuzz (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 5 minutes per target
            duration: 300
            timeout: 60
          - label: 30 minutes per target
            duration: 1800
            timeout: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      - name: Run fuzz targets
        run: |
          cd crates/ffwd-core
          for target in $(cargo +nightly fuzz list 2>/dev/null); do
            echo "=== Fuzzing $target for ${{ matrix.duration }}s ==="
            cargo +nightly fuzz run "$target" -- -max_total_time=${{ matrix.duration }}
          done
        env:
          RUSTUP_TOOLCHAIN: nightly
